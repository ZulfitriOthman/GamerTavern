  // =====================================================================
  // PORTAL WEBSITE
  // =====================================================================
  function portalShell(content) {
    const me = persona();
    const org = E.getOrg(state, me.orgId);
    const isInspector = me.role === 'inspector';
    const counts = waitingCount(me);
    return `<header class="portal-header"><div class="portal-header-inner gutter">
      <div class="brand"><span class="site-pill portal">Portal website</span><strong>Mashhor</strong><span>${isInspector ? 'Inspector Portal' : 'Vendor Portal'}</span></div>
      <nav class="portal-nav" aria-label="Main">
        <button type="button" class="nav-link ${/^p-(inspection|print)/.test(ui.view.name) ? 'active' : ''}" data-nav='${JSON.stringify(defaultViewFor(ui.persona))}'>Inspections ${counts ? `<span class="count" aria-label="${counts} waiting for you">${counts}</span>` : ''}</button>
        <button type="button" class="nav-link ${ui.view.name === 'p-settings' ? 'active' : ''}" data-nav='{"name":"p-settings"}'>Settings</button>
      </nav>
      <div class="user-chip"><span class="avatar">${initials(me.name)}</span><span class="user-chip-text"><strong>${esc(me.name)}</strong><span>${esc(org.name)} · ${esc(E.ROLE_LABELS[me.role])}</span></span></div>
    </div></header><main id="main"><div class="page gutter">${content}</div></main>`;
  }
  function waitingCount(me) {
    const q = (k) => E.queueList(state, me, k).length;
    return (me.role === 'inspector' ? q('returned') + q('assigned') : q('pending_verification')) + E.pendingSignoffs(state, me).length;
  }

  function pInspections() {
    const me = persona();
    const stages = E.stagesFor(state, me);
    const queues = [...E.QUEUES[me.role], ...(stages.length ? [{ key: 'signoffs', label: 'My sign-offs', empty: 'Nothing is waiting for your sign-off.' }] : [])];
    const active = queues.find((q) => q.key === ui.view.queue) || queues[0];
    const list = E.queueList(state, me, active.key).slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    const org = E.getOrg(state, me.orgId);
    return pageHeader({ title: 'Inspections', desc: me.role === 'inspector' ? 'Vehicle checklists assigned to you. Save drafts as you go and submit them for client verification.' : `Vehicle inspections for ${esc(org.name)}: verify submitted checklists and follow them to Head of Operations approval.` })
      + flash()
      + (stages.length ? `<div class="alert info">Your account is assigned: ${stages.map((st) => `<strong>${esc(stageCaption(st))}</strong>`).join(', ')}. Open <em>My sign-offs</em> for inspections waiting on you.</div>` : '')
      + `<section class="card" aria-label="Inspection lists"><nav class="tabs" aria-label="Inspection lists">
        ${queues.map((q) => `<button type="button" class="tab ${q.key === active.key ? 'active' : ''}" data-nav='${JSON.stringify({ name: 'p-inspections', queue: q.key })}'>${esc(q.label)} <span class="count num">${E.queueList(state, me, q.key).length}</span></button>`).join('')}</nav>
        ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Vehicle</th><th>Template</th>${me.role === 'client' ? '<th>Inspector</th>' : ''}<th>Status</th><th>Revision</th><th>Updated</th></tr></thead><tbody>
          ${list.map((i) => `<tr><td>${navBtn({ name: 'p-inspection', id: i.id }, `<span class="cell-title">${esc(E.vehicleTitle(i.vehicle))}</span>`)}<span class="cell-sub">#${i.id}</span>${i.status === 'returned' && i.recheckReason ? `<span class="cell-sub" style="color:var(--danger)">Re-check: ${esc(i.recheckReason.slice(0, 80))}</span>` : ''}</td>
          <td>${esc(i.template.name)}</td>${me.role === 'client' ? `<td>${esc(E.getAccount(state, i.inspectorId).name)}</td>` : ''}<td>${badge(i.status)}</td><td class="num">${i.currentRevision || '—'}</td><td class="num subtle">${esc(fmt(i.updatedAt))}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="empty">${esc(active.empty)}</div>`}
      </section>`;
  }

  function pInspection() {
    const me = persona();
    const insp = E.getInspection(state, ui.view.id);
    const back = { label: 'Inspections', view: defaultViewFor(ui.persona) };
    if (!insp || !E.portalCanView(state, insp, me)) return pageHeader({ title: 'This inspection isn’t available', back, desc: 'Your account can’t open this inspection. It belongs to another company, or it isn’t assigned to you.' });
    const viewer = E.viewerFor(state, insp, me);
    const cur = E.currentRevision(insp);
    if (viewer.canEdit && (!ui.edit || ui.edit.id !== insp.id)) ui.edit = { id: insp.id, working: E.clone(insp.working), dirty: false };
    if (!viewer.canEdit) ui.edit = null;
    let main;
    if (viewer.canEdit) main = checklistEditor(insp);
    else if (cur) main = `<div class="alert info">Revision ${cur.revision} as submitted by ${esc(cur.submittedBy.name)}. Nothing on it can be changed; a re-check creates a new revision.</div>${checklistReadOnly(cur.snapshot.template, cur.snapshot.working)}`;
    else main = `<section class="card"><div class="empty"><strong>Not submitted yet</strong><br>It appears here once ${esc(E.getAccount(state, insp.inspectorId).name)} submits it for verification.</div></section>`;
    const decision = viewer.canVerify && cur ? `<section class="card" aria-labelledby="verify-title"><div class="card-head"><div><h2 id="verify-title">Client verification</h2><p>Review revision ${cur.revision}. Ask the inspector to re-check it, or send it on for Head of Operations approval.</p></div></div>
      <div class="card-body"><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-danger-outline" data-action="open-recheck">↺ Request Re-check</button><button type="button" class="btn btn-primary" data-action="open-forward">Submit to HOO Approval →</button></div></div></section>` : '';
    return pageHeader({
      title: E.vehicleTitle(insp.vehicle), badgeHtml: badge(insp.status), back,
      desc: `${esc(insp.template.name)} (v${insp.template.version}) · ${esc(E.getOrg(state, insp.orgId).name)}${insp.currentRevision ? ` · revision ${insp.currentRevision}` : ''}`,
      actions: cur || viewer.canEdit ? navBtn({ name: 'p-print', id: insp.id }, 'Print view', 'btn') : '',
    }) + flash()
      + (insp.status === 'returned' && insp.recheckReason ? `<div class="alert warning"><strong>Re-check requested by the client</strong><span class="prewrap">${esc(insp.recheckReason)}</span>${viewer.canEdit ? '<span>Correct the checklist below and resubmit it for verification. Your earlier revision stays on record unchanged.</span>' : ''}</div>` : '')
      + `<div class="split"><div class="stack">${main}${decision}${signoffPanel(insp, cur, viewer)}</div>
        <div class="stack">${nextSteps(insp)}${historyCard(insp, 'p-print')}</div></div>`;
  }

  function pSettings() {
    const me = persona();
    const stages = E.stagesFor(state, me);
    return pageHeader({ title: 'Settings', desc: 'Your portal account. Password changes exist in production and are not simulated here.' })
      + `<section class="card"><div class="card-head"><h2>Account</h2></div><div class="card-body"><dl class="kv">
        <dt>Full name</dt><dd>${esc(me.name)}</dd><dt>Username</dt><dd class="mono">${esc(me.username)}</dd><dt>Company</dt><dd>${esc(E.getOrg(state, me.orgId).name)}</dd>
        <dt>Role</dt><dd>${esc(E.ROLE_LABELS[me.role])}</dd><dt>Sign-off stages</dt><dd>${stages.map((st) => esc(stageCaption(st))).join(', ') || 'None'}</dd></dl>
        <p class="subtle" style="font-size:.85rem">Sign-off stages are assigned by Mashhor staff on the Admin website (Vendors → Inspection sign-offs).</p></div></section>`;
  }

  // =====================================================================
  // A4 PRINT VIEW (both sites)
  // =====================================================================
  function printView(site) {
    const insp = E.getInspection(state, ui.view.id);
    const back = { name: site === 'admin' ? 'a-inspection' : 'p-inspection', id: ui.view.id };
    if (!insp || (site === 'portal' && !E.portalCanView(state, insp, persona()))) return pageHeader({ title: 'Nothing to print', back: { label: 'Back to inspection', view: back } });
    const viewer = site === 'portal' ? E.viewerFor(state, insp, persona()) : null;
    const draftAllowed = site === 'admin' || (viewer && viewer.canEdit);
    const revNum = Number(ui.view.rev) || insp.currentRevision;
    const rev = revNum ? E.getRevision(insp, revNum) : null;
    const isDraft = !rev;
    if (isDraft && !draftAllowed) return pageHeader({ title: 'Nothing to print', back: { label: 'Back to inspection', view: back }, desc: 'There is no submitted revision yet.' });
    const tpl = rev ? rev.snapshot.template : insp.template;
    const w = rev ? rev.snapshot.working : (ui.edit && ui.edit.id === insp.id ? ui.edit.working : insp.working);
    const v = rev ? rev.snapshot.vehicle : insp.vehicle;
    const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
    const options = insp.revisions.slice().reverse().map((r) => `<option value="${r.revision}" ${rev && r.revision === rev.revision ? 'selected' : ''}>Revision ${r.revision}${r.revision === insp.currentRevision ? ' (current)' : ' (earlier)'} — ${esc(fmt(r.submittedAt))}</option>`).join('');
    const sigBox = (stage) => {
      const s = rev && rev.signoffs.find((x) => x.stage === stage);
      return `<div class="sig"><div><strong>${esc(E.STAGE_LABELS[stage])}</strong>${E.CAPTIONS[stage] ? `<br><span>(${esc(E.CAPTIONS[stage])})</span>` : ''}</div><div class="line">${s ? `${esc(s.name)}<br><span class="num">${esc(fmt(s.at))}</span>` : '<span style="color:#888">Not confirmed</span>'}</div></div>`;
    };
    const ack = !rev ? 'Not submitted' : rev.acknowledgement === 'auto' ? 'Auto-acknowledged — no remarks' : rev.acknowledgement === 'pending' ? 'Pending' : (() => { const s = rev.signoffs.find((x) => x.stage === 'acknowledgement'); return `Acknowledged by ${esc(s.name)}, ${esc(fmt(s.at))}`; })();
    return `<div class="print-toolbar no-print">${navBtn(back, '← Back to inspection', 'btn')}
        <label class="field" style="min-width:min(100%,320px)"><span>Revision</span><select class="select" id="print-rev" data-change="print-rev">${options}${draftAllowed && E.EDITABLE.includes(insp.status) ? `<option value="0" ${isDraft ? 'selected' : ''}>Working draft (not submitted)</option>` : ''}</select></label>
        <span class="grow subtle" style="font-size:.85rem">A4 layout.${framed ? ' Open the prototype in its own browser tab to print or save as PDF.' : ' Use Print to print or save as PDF.'}</span>
        ${framed ? '' : '<button type="button" class="btn btn-primary" data-action="print">Print</button>'}</div>
      <div class="sheet-wrap"><article class="a4" aria-label="Print view">
        ${isDraft ? '<div class="watermark">DRAFT</div>' : ''}
        <div class="doc-head"><div><h1>${esc(tpl.name)}</h1><div>${esc(E.getOrg(state, insp.orgId).name)} · Vehicle inspection record</div></div>
          <div style="text-align:right"><strong>Inspection #${insp.id}</strong><br>${isDraft ? 'Working draft' : `Revision ${rev.revision}${rev.revision === insp.currentRevision ? '' : ' (superseded)'}`}<br>Template v${tpl.version}</div></div>
        <dl class="kv"><dt>Vehicle type</dt><dd>${esc(v.type)}</dd><dt>Plate</dt><dd>${esc(v.plate) || '—'}</dd><dt>Registration no.</dt><dd>${esc(v.registrationNo) || '—'}</dd><dt>MOD registration no.</dt><dd>${esc(v.modRegistrationNo) || '—'}</dd>
          <dt>Inspector</dt><dd>${esc(rev ? rev.submittedBy.name : E.getAccount(state, insp.inspectorId).name)}</dd><dt>Submitted</dt><dd>${rev ? esc(fmt(rev.submittedAt)) : '—'}</dd>
          <dt>Client verification</dt><dd>${rev && rev.verifiedBy ? `${esc(rev.verifiedBy.name)}, ${esc(fmt(rev.verifiedBy.at))}` : 'Not verified'}</dd></dl>
        <table><thead><tr><th style="width:12mm">No.</th><th>Item</th><th style="width:16mm">Mark</th><th>Remark</th></tr></thead><tbody>
          ${tpl.sections.map((s, si) => `<tr><td colspan="4" class="sec">${si + 1}. ${esc(s.title)}</td></tr>${s.items.map((it, ii) => `<tr><td>${si + 1}.${ii + 1}</td><td>${esc(it.label)}</td><td style="text-align:center">${w.marks[it.key] ? esc(E.LEGEND.find((l) => l.value === w.marks[it.key]).symbol) : ''}</td><td>${esc(w.itemRemarks[it.key] || '')}</td></tr>`).join('')}`).join('')}
        </tbody></table>
        <div style="font-size:8.5pt">${E.LEGEND.map((l) => `${esc(l.symbol)} = ${esc(l.label)}`).join(' · ')}</div>
        <div><strong>Remarks / comments</strong><p class="prewrap">${esc(w.comments) || '—'}</p></div>
        <div style="display:grid;grid-template-columns:40mm 1fr;gap:5mm;align-items:start"><div>${diagram(w.damage.markers, false)}</div>
          <div><strong>Damage assessment</strong>${w.damage.markers.length ? `<ol style="margin:1mm 0;padding-left:5mm">${w.damage.markers.map((m) => `<li>${esc(m.note) || '—'}</li>`).join('')}</ol>` : '<p>No damage marked.</p>'}${w.damage.notes ? `<p class="prewrap">${esc(w.damage.notes)}</p>` : ''}</div></div>
        <div class="sig-grid">${['checked_by', 'agreed_by', 'approved_by'].map(sigBox).join('')}</div>
        <div><strong>Acknowledgement</strong> (not an approval): ${ack}</div>
        <div class="sim-foot">Prototype print view — sample data; name confirmations are simulated. Generated ${esc(fmt(new Date().toISOString()))}.</div>
      </article></div>`;
  }

  // ---------- modal ----------
  function modalHtml() {
    const m = ui.modal;
    if (!m) return '';
    let body = '';
    if (m.kind === 'recheck') body = `<label class="field"><span>What needs to be re-checked?</span><textarea class="textarea ${m.error ? 'invalid' : ''}" id="modal-input" rows="5" maxlength="2000">${esc(m.value || '')}</textarea>${m.error ? `<span class="err">${esc(m.error)}</span>` : ''}</label>`;
    if (m.kind === 'sign') {
      const me = persona();
      body = `<div class="demo-hint">Demo account full name: <strong>${esc(me.name)}</strong>. In production the person types their own name; spacing and capital letters don’t matter.</div>
        <label class="field"><span>Your full name</span><input class="input ${m.error ? 'invalid' : ''}" id="modal-input" value="${esc(m.value || '')}" autocomplete="off">${m.error ? `<span class="err">${esc(m.error)}</span>` : ''}</label>`;
    }
    return `<div class="scrim" data-action="modal-scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <form data-form="modal" novalidate><div class="dialog-head"><h2 id="dlg-title">${esc(m.title)}</h2><p>${esc(m.description)}</p></div>
      ${body ? `<div class="dialog-body">${body}</div>` : ''}
      <div class="dialog-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${esc(m.confirm)}</button></div></form></div></div>`;
  }

  // ---------- render ----------
  function render() {
    let content;
    if (isAdmin()) {
      const page = { 'a-inspections': aInspections, 'a-inspection': aInspection, 'a-print': () => printView('admin'), 'a-vendors': aVendors, 'a-vendor': aVendor, 'a-templates': aTemplates, 'a-template': aTemplate }[ui.view.name] || aInspections;
      content = adminShell(page());
    } else {
      if (!persona()) { ui.persona = 'admin'; ui.view = { name: 'a-inspections' }; return render(); }
      const page = { 'p-inspections': pInspections, 'p-inspection': pInspection, 'p-print': () => printView('portal'), 'p-settings': pSettings }[ui.view.name] || pInspections;
      content = portalShell(page());
    }
    app.innerHTML = demoBar() + content + modalHtml();
    const focus = app.querySelector('#modal-input');
    if (focus) focus.focus();
  }

  // ---------- events ----------
  function readForm(form) { return Object.fromEntries(new FormData(form).entries()); }
  function captureCreate() { const f = app.querySelector('form[data-form="create"]'); if (f) ui.createValues = { ...ui.createValues, ...readForm(f) }; }

  app.addEventListener('click', (ev) => {
    const nav = ev.target.closest('[data-nav]');
    if (nav) {
      ev.preventDefault();
      const target = JSON.parse(nav.dataset.nav);
      // Unsaved checklist edits survive a trip to the print view (it shows them as a draft); anything else asks first.
      const keepsEdits = target.name.endsWith('print') || ui.view.name.endsWith('print');
      if (ui.edit && ui.edit.dirty && !keepsEdits && !confirmLeave()) return;
      go(target); return;
    }
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const insp = ui.view.id ? E.getInspection(state, ui.view.id) : null;
    if (a === 'modal-scrim') { if (ev.target === el) { ui.modal = null; render(); } return; }
    if (a === 'close-modal') { ui.modal = null; render(); return; }
    if (a === 'reset') {
      if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { if (ui.resetArmed) { ui.resetArmed = false; render(); } }, 4000); return; }
      state = E.seedState(); ui.resetArmed = false; ui.edit = null; ui.creating = false; ui.createValues = {}; ui.createErrors = {}; ui.filter = '';
      ui.persona = 'admin'; go({ name: 'a-inspections' }); ui.notice = 'Demo reset to the sample data.'; render(); return;
    }
    if (a === 'persona') { switchPersona(el.dataset.key); return; }
    if (a === 'filter') { ui.filter = el.dataset.status; render(); return; }
    if (a === 'new-inspection') { ui.creating = true; ui.createErrors = {}; ui.createValues = {}; render(); app.querySelector('#c-org')?.focus(); return; }
    if (a === 'cancel-create') { ui.creating = false; render(); return; }
    if (a === 'print') { window.print(); return; }
    if (a === 'diagram' && ui.edit) {
      const svg = el.closest('svg'); const r = svg.getBoundingClientRect();
      const x = r.width ? Math.round(((ev.clientX - r.left) / r.width) * 200) : 100;
      const y = r.height ? Math.round(((ev.clientY - r.top) / r.height) * 400) : 200;
      ui.edit.working.damage.markers.push({ x: Math.min(190, Math.max(10, x)), y: Math.min(390, Math.max(10, y)), note: '' });
      ui.edit.dirty = true; render();
      app.querySelector(`#marker-note-${ui.edit.working.damage.markers.length - 1}`)?.focus();
      return;
    }
    if (a === 'remove-marker' && ui.edit) { ui.edit.working.damage.markers.splice(Number(el.dataset.index), 1); ui.edit.dirty = true; render(); return; }
    if (a === 'save-draft' && insp) {
      act(() => { E.saveDraft(state, persona(), insp.id, ui.edit.working); ui.edit.dirty = false; ui.missing = null; },
        insp.status === 'returned' ? 'Draft saved. The inspection stays “Re-check requested” until you resubmit it.' : 'Draft saved.');
      return;
    }
    if (a === 'start-submit' && insp) {
      const missing = E.missingMarks(insp.template, ui.edit.working);
      if (missing.length) { ui.missing = missing; ui.error = `Complete the checklist before submitting (${missing.length} missing).`; ui.notice = ''; render(); app.querySelector(`[data-row="${missing[0]}"]`)?.scrollIntoView({ block: 'center' }); return; }
      const remarks = E.hasRemarks(ui.edit.working);
      ui.modal = { kind: 'submit', title: `Submit revision ${insp.currentRevision + 1}?`, confirm: 'Submit for verification',
        description: `The checklist is locked while the client reviews it. ${remarks ? 'It has remarks, so acknowledgement will be pending.' : 'It has no remarks, so it will be auto-acknowledged (this is not an approval).'}${insp.currentRevision ? ` Revision ${insp.currentRevision} stays on record unchanged.` : ''}` };
      render(); return;
    }
    if (a === 'open-recheck') { ui.modal = { kind: 'recheck', title: 'Request Re-check', confirm: 'Request Re-check', description: 'The inspector is asked to inspect again and correct the checklist. Say which items are missing or incorrect.' }; render(); return; }
    if (a === 'open-forward') { ui.modal = { kind: 'forward', title: 'Submit to HOO Approval?', confirm: 'Submit to HOO Approval', description: `You confirm revision ${insp.currentRevision} as verified. It goes to the Head of Operations for approval and can no longer be returned from here.` }; render(); return; }
    if (a === 'open-sign') { const st = el.dataset.stage; ui.modal = { kind: 'sign', stage: st, title: `Confirm: ${stageCaption(st)}`, confirm: 'Confirm', description: `You confirm revision ${insp.currentRevision} of ${E.vehicleTitle(insp.vehicle)} as ${stageCaption(st)}.` }; render(); return; }
  });
  function confirmLeave() {
    ui.error = 'You have unsaved changes. Save the draft first, or click again to leave without saving.';
    if (ui.leaveArmed) { ui.leaveArmed = false; ui.edit = null; return true; }
    ui.leaveArmed = true; render(); setTimeout(() => { ui.leaveArmed = false; }, 5000); return false;
  }

  app.addEventListener('submit', (ev) => {
    const form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    const kind = form.dataset.form;
    const insp = ui.view.id ? E.getInspection(state, ui.view.id) : null;
    if (kind === 'create') {
      captureCreate();
      try {
        const created = E.createInspection(state, persona(), ui.createValues);
        ui.creating = false; ui.createValues = {}; ui.createErrors = {}; ui.filter = '';
        ui.notice = `Inspection #${created.id} created and assigned to ${E.getAccount(state, created.inspectorId).name}.`; ui.error = '';
        persist(); render();
      } catch (err) {
        if (!(err instanceof E.WorkflowError)) throw err;
        ui.createErrors = { [err.extra.field || 'orgId']: err.message }; render();
      }
      return;
    }
    if (kind === 'update' && insp) { const f = readForm(form); act(() => E.updateInspection(state, persona(), insp.id, f), 'Assignment saved.'); return; }
    if (kind === 'signatories') {
      const org = E.getOrg(state, ui.view.id); const f = readForm(form);
      act(() => { state.signatories[org.id] = Object.fromEntries(E.STAGES.filter((st) => f[st]).map((st) => [st, f[st]])); org.ackBlocksApproval = f.ackBlocksApproval === 'on'; }, 'Inspection sign-off assignments saved.');
      return;
    }
    if (kind === 'modal' && insp && ui.modal) {
      const m = ui.modal; const input = app.querySelector('#modal-input'); m.value = input ? input.value : '';
      const me = persona();
      if (m.kind === 'submit') act(() => { E.submitInspection(state, me, insp.id, ui.edit.working); ui.edit = null; ui.missing = null; }, `Revision ${insp.currentRevision + 1} submitted for client verification.`);
      if (m.kind === 'recheck') act(() => E.requestRecheck(state, me, insp.id, insp.currentRevision, m.value), 'Returned to the inspector for re-check.');
      if (m.kind === 'forward') act(() => E.verifyInspection(state, me, insp.id, insp.currentRevision), `Revision ${insp.currentRevision} submitted to HOO approval.`);
      if (m.kind === 'sign') act(() => E.signStage(state, me, insp.id, m.stage, insp.currentRevision, m.value), `${stageCaption(m.stage)} confirmed for revision ${insp.currentRevision}.`);
    }
  });

  app.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.change === 'persona') { switchPersona(t.value); return; }
    if (t.dataset.change === 'create-org') { captureCreate(); ui.createValues.inspectorId = ''; render(); app.querySelector('#c-inspector')?.focus(); return; }
    if (t.dataset.change === 'create-template') { captureCreate(); render(); app.querySelector('#c-template')?.focus(); return; }
    if (t.dataset.change === 'print-rev') { ui.view = { ...ui.view, rev: Number(t.value) || null }; if (!Number(t.value)) ui.view.rev = -1; persist(); render(); return; }
    if (t.dataset.mark && ui.edit) {
      ui.edit.working.marks[t.dataset.mark] = t.value; ui.edit.dirty = true;
      if (ui.missing) { ui.missing = ui.missing.filter((k) => k !== t.dataset.mark); const row = app.querySelector(`[data-row="${t.dataset.mark}"]`); row?.classList.remove('missing'); row?.querySelector('.cell-sub')?.remove(); }
      updateEditStatus();
    }
  });
  app.addEventListener('input', (ev) => {
    const t = ev.target;
    if (!ui.edit) return;
    const w = ui.edit.working;
    if (t.dataset.remark) w.itemRemarks[t.dataset.remark] = t.value;
    else if (t.dataset.field === 'comments') w.comments = t.value;
    else if (t.dataset.field === 'damage-notes') w.damage.notes = t.value;
    else if (t.dataset.markerNote !== undefined) w.damage.markers[Number(t.dataset.markerNote)].note = t.value;
    else return;
    ui.edit.dirty = true; updateEditStatus();
  });
  function updateEditStatus() { const insp = E.getInspection(state, ui.view.id); const el = app.querySelector('#edit-status'); if (el && insp) el.innerHTML = editStatus(insp); }
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && ui.modal) { ui.modal = null; render(); } });

  render();
  window.__prototype = { get state() { return state; }, ui };
})();
</script>
</body>
</html>
