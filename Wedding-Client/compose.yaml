services:
  wedding:
    image: node:24-bookworm-slim
    working_dir: /app
    ports:
      - "127.0.0.1:8723:8723"
    volumes:
      - .:/app
      - wedding_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8723 --strictPort"

volumes:
  wedding_node_modules: